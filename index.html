<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>방명록 · Supabase 연동</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>📖 방명록</h1>
      <p class="sub">Supabase에 실시간으로 저장되는 방명록 데모</p>
      <div id="status" class="status">연결 준비 중...</div>
    </header>

    <form id="form" class="card form">
      <div class="row">
        <input id="name" type="text" placeholder="이름 (선택)" maxlength="40" />
      </div>
      <div class="row">
        <textarea id="message" placeholder="메시지를 남겨보세요..." rows="3" maxlength="500" required></textarea>
      </div>
      <div class="row right">
        <button id="submit" type="submit">남기기</button>
      </div>
    </form>

    <ul id="list" class="list"></ul>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
