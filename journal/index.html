<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
<title>매매일지</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>" />
<link rel="stylesheet" href="styles.css?v=2026.09.23a" />
</head>
<body>

<!-- ───────────── 로그인 ───────────── -->
<section id="authView" class="auth" hidden>
  <form id="authForm" class="card auth-card">
    <h1 class="auth-title">📓 매매일지</h1>
    <p class="auth-sub">내 계정으로 로그인하세요</p>
    <label class="field">
      <span>이메일</span>
      <input id="authEmail" type="email" autocomplete="username" required />
    </label>
    <label class="field">
      <span>비밀번호</span>
      <input id="authPw" type="password" autocomplete="current-password" required />
    </label>
    <button id="authBtn" class="btn btn-primary btn-block" type="submit">로그인</button>
    <p id="authMsg" class="msg" role="status"></p>
  </form>
</section>

<!-- ───────────── 앱 ───────────── -->
<div id="appView" class="wrap" hidden>

  <header class="topbar">
    <h1 class="brand">📓 매매일지</h1>
    <div class="topbar-right">
      <select id="currency" class="mini-select" aria-label="통화">
        <option value="USDT">USDT</option>
        <option value="KRW">원화</option>
      </select>
      <button id="logoutBtn" class="btn btn-ghost btn-sm" type="button">로그아웃</button>
    </div>
  </header>

  <!-- 빠른 입력 -->
  <form id="tradeForm" class="card entry">
    <div class="entry-head">
      <h2 id="entryTitle" class="entry-title">✍️ 매매 기록</h2>
      <button id="cancelEdit" class="btn btn-ghost btn-sm" type="button" hidden>수정 취소</button>
    </div>

    <div class="entry-grid">
      <label class="field">
        <span>날짜</span>
        <input id="fDate" type="date" required />
      </label>

      <label class="field">
        <span>코인</span>
        <input id="fSymbol" type="text" list="symbolList" placeholder="BTC" autocapitalize="characters"
               autocomplete="off" maxlength="20" required />
        <datalist id="symbolList"></datalist>
      </label>

      <div class="field">
        <span>포지션</span>
        <div class="seg" role="radiogroup" aria-label="포지션">
          <button type="button" class="seg-btn is-on" data-pos="long" role="radio" aria-checked="true">롱</button>
          <button type="button" class="seg-btn" data-pos="short" role="radio" aria-checked="false">숏</button>
        </div>
      </div>

      <label class="field">
        <span>실현 손익 <em id="unitHint">(USDT)</em></span>
        <input id="fPnl" type="number" step="any" inputmode="decimal" placeholder="-38.5" required />
      </label>

      <label class="field">
        <span>결과</span>
        <select id="fResult">
          <option value="auto">자동 (손익 기준)</option>
          <option value="win">승</option>
          <option value="draw">무</option>
          <option value="lose">패</option>
        </select>
      </label>
    </div>

    <!-- 매매 계획 — 진입가·TP·SL로 계획 손익비를 계산한다 -->
    <fieldset class="plan">
      <legend class="plan-legend">매매 계획</legend>
      <div class="plan-grid plan-grid-3">
        <label class="field">
          <span>전략</span>
          <select id="fStrategy">
            <option value="">단일 진입</option>
            <option value="FVG">FVG (3구간)</option>
            <option value="오더블럭">오더블럭 (3구간)</option>
            <option value="기타">기타</option>
          </select>
        </label>
        <label class="field">
          <span>TP <em>목표가</em></span>
          <input id="fTp" type="number" step="any" inputmode="decimal" placeholder="69000" required />
        </label>
        <label class="field">
          <span>SL <em>손절가</em></span>
          <input id="fSl" type="number" step="any" inputmode="decimal" placeholder="66300" required />
        </label>
      </div>

      <!-- 진입 구간 — FVG처럼 나눠 들어갈 때 여러 개가 된다. TP·SL은 공통. -->
      <div class="legs">
        <div class="legs-head">
          <span class="legs-title">진입 구간</span>
          <button type="button" id="addLeg" class="btn btn-ghost btn-sm">+ 구간 추가</button>
        </div>
        <div id="legRows"></div>
        <div id="legAvg" class="legs-avg" hidden></div>
      </div>
      <div class="plan-grid plan-grid-3">
        <label class="field">
          <span>계좌 <em id="acctUnit">(USDT)</em></span>
          <input id="fAccount" type="number" step="any" inputmode="decimal" placeholder="10000" />
        </label>
        <label class="field">
          <span>최대 손실률 <em>(%)</em></span>
          <input id="fMaxLoss" type="number" step="any" inputmode="decimal" placeholder="1" />
        </label>
        <label class="field">
          <span>레버리지 <em>(배)</em></span>
          <input id="fLeverage" type="number" step="any" min="1" inputmode="decimal" placeholder="10" />
        </label>
        <p class="plan-memo">이 셋은 기억해뒀다가 다음에 자동으로 채워집니다</p>
      </div>

      <div id="rrPreview" class="rr" role="status" aria-live="polite">
        <span class="rr-hint">진입가 · TP · SL을 넣으면 계획 손익비가 계산됩니다</span>
      </div>
    </fieldset>

    <label class="field">
      <span>매매 복기 <em>(분할 매수·매도, 진입 근거, 감정 등)</em></span>
      <textarea id="fMemo" rows="2" placeholder="예) 4h 저항 돌파 확인 후 3회 분할 진입, 목표가 전 조급하게 청산"></textarea>
    </label>

    <div class="entry-foot">
      <div id="tagPicks" class="tagpicks"></div>
      <button id="saveBtn" class="btn btn-primary" type="submit">기록하기</button>
    </div>
    <p id="formMsg" class="msg" role="status"></p>
  </form>

  <!-- 탭 -->
  <nav class="tabs" role="tablist">
    <button class="tab is-on" data-tab="today" role="tab" aria-selected="true">오늘</button>
    <button class="tab" data-tab="month" role="tab" aria-selected="false">이번 달</button>
    <button class="tab" data-tab="all" role="tab" aria-selected="false">전체</button>
    <button class="tab" data-tab="stats" role="tab" aria-selected="false">통계</button>
    <button class="tab" data-tab="review" role="tab" aria-selected="false">복기</button>
  </nav>

  <main id="panels">
    <section class="panel" data-panel="today"></section>
    <section class="panel" data-panel="month" hidden></section>
    <section class="panel" data-panel="all" hidden></section>
    <section class="panel" data-panel="stats" hidden></section>
    <section class="panel" data-panel="review" hidden></section>
  </main>

  <footer class="foot">
    <button id="csvBtn" class="btn btn-ghost btn-sm" type="button">⬇ CSV 내보내기</button>
    <span id="syncMsg" class="foot-msg"></span>
    <span id="verMsg" class="foot-msg" title="지금 돌고 있는 앱 버전"></span>
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- ?v= 를 붙여야 브라우저가 옛 파일을 캐시에서 꺼내 쓰지 않는다 -->
<script type="module" src="app.js?v=2026.09.23a"></script>
</body>
</html>
